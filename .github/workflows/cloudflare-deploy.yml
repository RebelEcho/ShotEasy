name: Cloudflare Deploy

# 推送到 main 分支时自动部署到 Cloudflare Pages
# 也可在 GitHub Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # 使用 Windows 运行器：scripts/download-models.ps1 调用了 curl.exe（Windows 专用），
    # 在 Windows 上可直接运行，无需改写脚本
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Cloudflare 单文件限制 25MB，需在构建前下载量化模型 model_quantized.onnx（6.6MB）
      # 替代 fp32 模型（25.9MB），模型文件必须位于 public/ 下，构建时才会被拷贝进 dist/
      - name: Download models
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/download-models.ps1

      - name: Verify model files
        shell: pwsh
        run: |
          $dst = "public/models/Xenova/modnet/onnx"
          Get-ChildItem $dst | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          $q = "$dst/model_quantized.onnx"
          if (-not (Test-Path $q) -or (Get-Item $q).Length -eq 0) {
            Write-Error "量化模型缺失或为空：$q"
            exit 1
          }

      # 关键：必须显式注入 DEPLOY_TARGET / VITE_DEPLOY_TARGET=cloudflare
      # - DEPLOY_TARGET: astro.config.mjs 据此选择 @astrojs/cloudflare 适配器
      # - VITE_DEPLOY_TARGET: 注入到客户端，modnetSingleton.js 据此加载量化模型
      # 注意：跳过 astro check（TS 错误与依赖无关），直接执行 astro build
      - name: Build
        env:
          DEPLOY_TARGET: cloudflare
          VITE_DEPLOY_TARGET: cloudflare
        run: pnpm exec astro build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shot-easy-website
